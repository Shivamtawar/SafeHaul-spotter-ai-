repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (backend)
        entry: backend/.venv/bin/ruff check --fix backend
        language: system
        pass_filenames: false
        files: ^backend/
      - id: ruff-format
        name: ruff format (backend)
        entry: backend/.venv/bin/ruff format backend
        language: system
        pass_filenames: false
        files: ^backend/
      - id: mypy
        name: mypy (backend)
        entry: bash -c 'cd backend && .venv/bin/mypy'
        language: system
        pass_filenames: false
        files: ^backend/
      - id: frontend-lint
        name: oxlint + prettier + tsc (frontend)
        entry: bash -c 'cd frontend && npm run lint && npm run format:check && npm run typecheck'
        language: system
        pass_filenames: false
        files: ^frontend/
