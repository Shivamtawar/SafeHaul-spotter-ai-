# Render Blueprint: one free web service that builds the React app and serves it with Django.
services:
  - type: web
    name: safehaul
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 60 --access-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ORS_API_KEY
        sync: false # you paste it in the Render dashboard; it is never stored in git
